services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agent_orchestrator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_dev_password
      POSTGRES_DB: orchestrator_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator_dev"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
